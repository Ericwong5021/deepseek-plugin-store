name: Governance semantic PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: governance-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'automation/governance-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/create-github-app-token@v2
        if: ${{ vars.GOVERNANCE_APP_ID != '' }}
        id: app-token
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
      - name: Review API diff
        id: review
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          LLM_CLASSIFIER_API_KEY: ${{ secrets.LLM_CLASSIFIER_API_KEY }}
          LLM_CLASSIFIER_BASE_URL: ${{ vars.LLM_CLASSIFIER_BASE_URL || 'https://codex.talktodo.cn/v1' }}
          LLM_CLASSIFIER_MODEL: ${{ vars.LLM_CLASSIFIER_MODEL || 'gpt-5.6-luna' }}
        run: node scripts/governance/pr-review.mjs
      - name: Apply review result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REVIEW_FILE: ${{ steps.review.outputs.review_file }}
          RISK: ${{ steps.review.outputs.risk }}
        run: |
          gh label create "risk:r0" --repo "$GITHUB_REPOSITORY" --color "0e8a16" --force
          gh label create "risk:r1" --repo "$GITHUB_REPOSITORY" --color "fbca04" --force
          gh label create "risk:r2" --repo "$GITHUB_REPOSITORY" --color "b60205" --force
          for label in "risk:r0" "risk:r1" "risk:r2"; do gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true; done
          gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --add-label "risk:${RISK,,}"
          marker="<!-- governance-pr-review:v1 pr=${{ github.event.pull_request.number }} -->"
          body_file="$RUNNER_TEMP/governance-pr-comment.md"
          printf '%s\n\n' "$marker" > "$body_file"
          sed -n '1,240p' "$REVIEW_FILE" >> "$body_file"
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --field "body=$(<"$body_file")"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --field "body=$(<"$body_file")"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: governance-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.review.outputs.record_file }}
          retention-days: 90
      - name: Enable policy-approved auto merge
        if: ${{ steps.review.outputs.auto_merge == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --auto --squash
