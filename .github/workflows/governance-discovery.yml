name: Governance discovery

on:
  schedule:
    - cron: '23 * * * *'
    - cron: '11 3 * * *'
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        required: false
        default: incremental
        type: choice
        options: [incremental, daily, reconcile]
      reconcile_partition:
        required: false
        default: '0'
        type: choice
        options: ['0', '1', '2', '3']

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: governance-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reject pending batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list --state open --json number,headRefName,url --jq '.[] | select(.headRefName | startswith("automation/governance-discovery-")) | "#\(.number) \(.url)"')
          if [ -n "$pending" ]; then echo "::error::an earlier governance discovery batch is still open"; echo "$pending"; exit 1; fi
      - name: Discover governance state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCOVERY_MODE: ${{ inputs.mode || (github.event.schedule == '17 4 * * 0' && 'reconcile') || (github.event.schedule == '11 3 * * *' && 'daily') || 'incremental' }}
          DISCOVERY_RECONCILE_PARTITION: ${{ inputs.reconcile_partition || (github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0' && '0') || '' }}
          DISCOVERY_VERIFY_LIMIT: '250'
        run: node scripts/update.mjs
      - name: Validate state
        run: node scripts/validate-registry.mjs
      - name: Open state batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unexpected=$(git status --short | sed -E 's/^.. //g' | grep -Ev '^governance/state/' || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
          git add governance/state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          base=$(git rev-parse origin/main)
          branch="automation/governance-discovery-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: update governance discovery state"
          git push origin "HEAD:$branch"
          url=$(gh pr create --base main --head "$branch" --title "chore: update governance discovery state" --body "Governance state batch")
          number=$(gh pr view "$url" --json number --jq .number)
          head=$(git rev-parse HEAD)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          gh workflow run governance-pr-ci.yml --ref "$branch" -f base_sha="$base" -f head_sha="$head" -f pr_number="$number"
      - name: Merge validated batch and publish
        if: ${{ steps.batch.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.batch.outputs.number }}
          HEAD_SHA: ${{ steps.batch.outputs.head }}
        run: |
          ready=false
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq .state)
            passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq '[.statuses[] | select(.state == "success") | .context] | unique | length')
            if [ "$state" = "success" ] && [ "$passed" -ge 6 ]; then ready=true; break; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then echo "::error::governance PR checks did not complete"; exit 1; fi
          merged=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="$HEAD_SHA" -f commit_title="chore: publish governance discovery (#${PR_NUMBER})" --jq .merged)
          if [ "$merged" != "true" ]; then echo "::error::governance discovery PR was not merged"; exit 1; fi
          gh workflow run governance-publish.yml --ref main
      - name: Continue full reconciliation
        if: ${{ (inputs.mode == 'reconcile' || github.event.schedule == '17 4 * * 0') && (inputs.reconcile_partition || '0') != '3' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_PARTITION: ${{ inputs.reconcile_partition || (github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0' && '0') || '0' }}
        run: |
          next_partition=$((RECONCILE_PARTITION + 1))
          echo "::notice::continuing full reconciliation with partition $next_partition"
          gh workflow run governance-discovery.yml --ref main -f mode=reconcile -f reconcile_partition="$next_partition"
