name: Update open-source catalog and rankings

concurrency:
  group: deepseek-plugin-store-main-write
  cancel-in-progress: false

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover candidates and regenerate catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_VERIFY_LIMIT: '250'
        run: node scripts/update.mjs
      - name: Verify ranking feeds
        run: |
          node -e "const c=require('./data/catalog-v2.json'); const r=c.collections?.rankings; if (!r?.generatedAt || !r?.eligibleCount || !['popular','new','active','rising'].every((key) => Array.isArray(r[key]?.items))) process.exit(1); console.log(JSON.stringify({ generatedAt: r.generatedAt, eligibleCount: r.eligibleCount, popular: r.popular.items.length, new: r.new.items.length, active: r.active.items.length, rising: r.rising.items.length, risingStatus: r.rising.status }))"
      - name: Analyze plugin quality with AI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com
          AI_MODEL: ${{ vars.AI_QUALITY_MODEL || 'deepseek-v4-flash' }}
          AI_QUALITY_LIMIT: ${{ vars.AI_QUALITY_LIMIT || '5' }}
        run: node scripts/analyze-quality.mjs
      - name: Record upstream snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor-upstream.mjs
      - name: Validate registry source
        run: node scripts/validate-registry.mjs
      - name: Validate deterministic catalogs
        run: node scripts/generate-catalog.mjs --check
      - name: Validate public projections
        run: node scripts/validate.mjs
      - name: Check generated file scope
        run: |
          unexpected=$(git status --short | sed -E 's/^.. //g' | grep -Ev '^data/(catalog-v2|catalog|plugins|editor-picks|candidates|observations|plugin-quality|upstream-sync)\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog-v2.json data/catalog.json data/plugins.json data/editor-picks.json data/candidates.json data/observations.json data/upstream-sync.json
          if [ -f data/plugin-quality.json ]; then git add data/plugin-quality.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: auto-update plugin list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload ranking snapshot
        uses: actions/upload-artifact@v4
        with:
          name: open-source-ranking-snapshot
          path: data/catalog-v2.json
          retention-days: 7
      - name: Trigger website deployment
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          else
            echo "deploy hook not configured"
          fi
