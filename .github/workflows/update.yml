name: Update plugin catalog and quality

concurrency:
  group: deepseek-plugin-store-main-write
  cancel-in-progress: false

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate catalog data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_ONLY: '1'
        run: node scripts/update.mjs
      - name: Analyze plugin quality with AI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com
          AI_MODEL: ${{ vars.AI_QUALITY_MODEL || 'deepseek-v4-flash' }}
          AI_QUALITY_LIMIT: ${{ vars.AI_QUALITY_LIMIT || '5' }}
        run: node scripts/analyze-quality.mjs
      - name: Record upstream snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor-upstream.mjs
      - name: Validate catalog
        run: node scripts/validate.mjs
      - name: Check generated file scope
        run: |
          unexpected=$(git status --short | sed -E 's/^.. //g' | grep -Ev '^data/(added-dates|catalog|plugins|plugin-quality|upstream-sync)\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/plugins.json data/added-dates.json data/upstream-sync.json
          if [ -f data/plugin-quality.json ]; then git add data/plugin-quality.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: auto-update plugin list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger website deployment
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          else
            echo "deploy hook not configured"
          fi
