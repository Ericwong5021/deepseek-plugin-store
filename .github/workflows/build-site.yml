name: Build site from README

on:
  push:
    branches: [main]
    paths: ['scripts/build-site.mjs', 'site/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site rows from READMEs
        run: node scripts/build-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: built-site-${{ github.sha }}
          path: |
            docs
            README.md
            README.en.md
            README.zh.md
          retention-days: 7
