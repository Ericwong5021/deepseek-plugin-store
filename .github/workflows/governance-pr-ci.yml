name: Governance PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  registry-schema:
    name: registry-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs registry-schema

  identity-uniqueness:
    name: identity-uniqueness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs identity-uniqueness

  path-scope:
    name: path-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs path-scope

  immutable-evidence:
    name: immutable-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs immutable-evidence

  policy-gate:
    name: policy-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs policy-gate

  catalog-determinism:
    name: catalog-determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/governance/pr-gate.mjs catalog-determinism
