name: Validate catalog

on:
  pull_request:
    paths:
      - data/**
      - scripts/**
      - package.json
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Validate compiled plugin boundary
        run: |
          test ! -e src
          test ! -e tsconfig.json
          test ! -e tsdown.config.ts
          test ! -e lib/client.js.map
          test -f lib/client.js
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle || p.main !== 'lib/index.js' || p.exports?.['./client']?.default !== './lib/client.js') process.exit(1)"
