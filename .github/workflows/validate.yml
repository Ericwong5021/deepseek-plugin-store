name: Validate catalog

on:
  pull_request:
    paths:
      - data/**
      - scripts/**
      - package.json
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
