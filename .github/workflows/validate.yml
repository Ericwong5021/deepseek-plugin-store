name: Validate catalog

on:
  pull_request:
    paths:
      - data/**
      - registry/**
      - scripts/**
      - package.json
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
  push:
    branches: [main]
    paths:
      - data/**
      - registry/**
      - scripts/**
      - package.json
      - .github/workflows/**
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:
    inputs:
      source_only:
        description: Validate canonical registry changes without derived catalogs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determine validation scope
        id: scope
        env:
          REQUESTED_SOURCE_ONLY: ${{ inputs.source_only && 'true' || 'false' }}
        run: |
          if [ "$REQUESTED_SOURCE_ONLY" = "true" ]; then
            echo "source_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate registry source
        env:
          REGISTRY_SOURCE_ONLY: ${{ steps.scope.outputs.source_only == 'true' && '1' || '0' }}
        run: node scripts/validate-registry.mjs
      - name: Validate deterministic catalogs
        if: ${{ steps.scope.outputs.source_only != 'true' }}
        run: node scripts/generate-catalog.mjs --check
      - name: Validate public projections
        if: ${{ steps.scope.outputs.source_only != 'true' }}
        run: node scripts/validate.mjs
      - name: Validate registry scripts
        run: |
          for file in scripts/registry-lib.mjs scripts/import-legacy-catalog.mjs scripts/generate-catalog.mjs scripts/discover.mjs scripts/update.mjs scripts/validate-registry.mjs scripts/validate.mjs scripts/analyze-quality.mjs scripts/monitor-upstream.mjs scripts/plugin-intake-agent.mjs scripts/classify-plugins.mjs scripts/governance/evidence.mjs scripts/governance/llm.mjs scripts/governance/policy.mjs scripts/governance/rules.mjs; do
            node --check "$file"
          done
      - name: Validate compiled plugin boundary
        run: |
          test ! -e src
          test ! -e tsconfig.json
          test ! -e tsdown.config.ts
          test ! -e lib/client.js.map
          test -f lib/client.js
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle || p.main !== 'lib/index.js' || p.exports?.['./client']?.default !== './lib/client.js') process.exit(1)"
