name: Classify plugins with LLM

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      plugin:
        required: false
        type: string
      limit:
        required: false
        default: '20'
        type: string
      force:
        required: false
        default: false
        type: boolean
      drain:
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: governance-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check pending batch
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("automation/governance-classification-"))] | length')
          echo "skip=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Classify governance state
        if: ${{ steps.pending.outputs.skip != 'true' }}
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_CLASSIFIER_API_KEY: ${{ secrets.LLM_CLASSIFIER_API_KEY }}
          LLM_CLASSIFIER_BASE_URL: ${{ vars.LLM_CLASSIFIER_BASE_URL || 'https://codex.talktodo.cn/v1' }}
          LLM_CLASSIFIER_MODEL: ${{ vars.LLM_CLASSIFIER_MODEL || 'gpt-5.3-codex-spark' }}
          LLM_CLASSIFIER_LIMIT: ${{ inputs.limit || vars.LLM_CLASSIFIER_LIMIT || '20' }}
          LLM_CLASSIFIER_CONCURRENCY: ${{ vars.LLM_CLASSIFIER_CONCURRENCY || '10' }}
          LLM_CLASSIFIER_PLUGIN: ${{ inputs.plugin || '' }}
          LLM_CLASSIFIER_FORCE: ${{ inputs.force && '1' || '0' }}
          GOVERNANCE_SHADOW_MODE: '0'
        run: node scripts/classify-plugins.mjs
      - name: Validate state
        if: ${{ steps.pending.outputs.skip != 'true' }}
        run: node scripts/validate-registry.mjs
      - name: Open state batch
        if: ${{ steps.pending.outputs.skip != 'true' }}
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unexpected=$(git status --short | sed -E 's/^.. //g' | grep -Ev '^governance/state/' || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
          git add governance/state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          base=$(git rev-parse origin/main)
          branch="automation/governance-classification-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: update governance classification state"
          git push origin "HEAD:$branch"
          url=$(gh pr create --base main --head "$branch" --title "chore: update governance classification state" --body "Governance state batch")
          number=$(gh pr view "$url" --json number --jq .number)
          head=$(git rev-parse HEAD)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          gh workflow run governance-pr-ci.yml --ref "$branch" -f base_sha="$base" -f head_sha="$head" -f pr_number="$number"
      - name: Merge validated batch and publish
        if: ${{ steps.batch.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.batch.outputs.number }}
          HEAD_SHA: ${{ steps.batch.outputs.head }}
          DRAIN: ${{ inputs.drain || false }}
          LIMIT: ${{ inputs.limit || vars.LLM_CLASSIFIER_LIMIT || '20' }}
          REMAINING: ${{ steps.classify.outputs.remaining }}
        run: |
          ready=false
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq .state)
            passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" --jq '[.statuses[] | select(.state == "success") | .context] | unique | length')
            if [ "$state" = "success" ] && [ "$passed" -ge 6 ]; then ready=true; break; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then exit 1; fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="$HEAD_SHA" -f commit_title="chore: publish model classifications (#${PR_NUMBER})" --jq 'select(.merged == true) | .sha'
          if [ "$DRAIN" = "true" ] && [ "$REMAINING" != "0" ]; then
            gh workflow run classify-plugins.yml --ref main -f limit="$LIMIT" -f force=false -f drain=true
          else
            gh workflow run governance-publish.yml --ref main
          fi
      - name: Publish completed drain
        if: ${{ inputs.drain && steps.pending.outputs.skip != 'true' && steps.batch.outputs.number == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run governance-publish.yml --ref main
