name: Plugin intake agent

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: deepseek-plugin-store-main-write
  cancel-in-progress: false

jobs:
  intake:
    if: ${{ github.event.issue.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect plugin submission
        id: intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/plugin-intake-agent.mjs
      - name: Ensure governance labels
        if: ${{ steps.intake.outputs.outcome != 'ignored' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ steps.intake.outputs.intent }}
          OUTCOME: ${{ steps.intake.outputs.outcome }}
        run: |
          gh label create "type:submission" --repo "$GITHUB_REPOSITORY" --color "1f6feb" --force
          gh label create "type:correction" --repo "$GITHUB_REPOSITORY" --color "8250df" --force
          gh label create "gov:preflight" --repo "$GITHUB_REPOSITORY" --color "fbca04" --force
          gh label create "gov:needs-changes" --repo "$GITHUB_REPOSITORY" --color "d93f0b" --force
          gh label create "gov:needs-human" --repo "$GITHUB_REPOSITORY" --color "b60205" --force
          gh label create "gov:approved" --repo "$GITHUB_REPOSITORY" --color "0e8a16" --force
          gh label create "gov:pr-open" --repo "$GITHUB_REPOSITORY" --color "0052cc" --force
          case "$OUTCOME" in
            accepted|correction) state_label="gov:approved" ;;
            needs_human) state_label="gov:needs-human" ;;
            *) state_label="gov:needs-changes" ;;
          esac
          if [ -n "$INTENT" ]; then
            gh issue edit "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --add-label "type:${INTENT}" --add-label "$state_label"
          else
            gh issue edit "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --add-label "$state_label"
          fi
      - name: Find an existing intake pull request
        if: ${{ steps.intake.outputs.outcome == 'accepted' || steps.intake.outputs.outcome == 'correction' }}
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "Closes #${ISSUE_NUMBER} in:body" --json url --jq '.[0].url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Validate registry change
        if: ${{ (steps.intake.outputs.outcome == 'accepted' || steps.intake.outputs.outcome == 'correction') && steps.existing.outputs.url == '' }}
        id: validation
        continue-on-error: true
        run: |
          REGISTRY_SOURCE_ONLY=1 node scripts/validate-registry.mjs
          node --check scripts/plugin-intake-agent.mjs
      - name: Check change scope
        if: ${{ (steps.intake.outputs.outcome == 'accepted' || steps.intake.outputs.outcome == 'correction') && steps.existing.outputs.url == '' && steps.validation.outcome == 'success' }}
        id: scope
        continue-on-error: true
        env:
          PLUGIN_ID: ${{ steps.intake.outputs.plugin_id }}
        run: |
          unexpected=$(git status --short | sed -E 's/^.. //g' | grep -Ev "^registry/plugins/${PLUGIN_ID}\.json$" || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
      - name: Create intake pull request
        if: ${{ (steps.intake.outputs.outcome == 'accepted' || steps.intake.outputs.outcome == 'correction') && steps.existing.outputs.url == '' && steps.validation.outcome == 'success' && steps.scope.outcome == 'success' }}
        id: pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLUGIN_ID: ${{ steps.intake.outputs.plugin_id }}
          REPOSITORY_NAME: ${{ steps.intake.outputs.repository }}
          PR_BODY_FILE: ${{ steps.intake.outputs.pr_body_file }}
          PR_TITLE: ${{ steps.intake.outputs.pr_title }}
          PR_DRAFT: ${{ steps.intake.outputs.pr_draft }}
        run: |
          branch="agent/plugin-intake-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "registry/plugins/${PLUGIN_ID}.json"
          git commit -m "$PR_TITLE"
          git push --set-upstream origin "$branch"
          draft_flag=()
          if [ "$PR_DRAFT" = "true" ]; then draft_flag=(--draft); fi
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "$PR_TITLE" --body-file "$PR_BODY_FILE" "${draft_flag[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f source_only=true
      - name: Mark pull request state
        if: ${{ steps.existing.outputs.url != '' || steps.pull_request.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PR_URL: ${{ steps.pull_request.outputs.url }}
          EXISTING_PR_URL: ${{ steps.existing.outputs.url }}
        run: |
          PR_URL="${NEW_PR_URL:-$EXISTING_PR_URL}"
          gh issue edit "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --add-label "gov:pr-open"
          printf '%s\n\n%s\n' "录入检查已完成，PR 正在处理：${PR_URL}" "Admission review is complete. The PR is in progress: ${PR_URL}" > "$RUNNER_TEMP/status.md"
      - name: Prepare review result
        if: ${{ steps.intake.outputs.reply_file != '' && steps.existing.outputs.url == '' && steps.pull_request.outputs.url == '' }}
        env:
          REPLY_FILE: ${{ steps.intake.outputs.reply_file }}
        run: cp "$REPLY_FILE" "$RUNNER_TEMP/status.md"
      - name: Prepare automation failure
        if: ${{ (steps.intake.outputs.outcome == 'accepted' || steps.intake.outputs.outcome == 'correction') && steps.existing.outputs.url == '' && (steps.validation.outcome == 'failure' || steps.scope.outcome == 'failure' || steps.pull_request.outcome == 'failure') }}
        run: |
          printf '%s\n\n%s\n' "插件预检查已通过，但 Registry 校验或 PR 创建失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "The plugin preflight passed, but registry validation or PR creation failed." > "$RUNNER_TEMP/status.md"
      - name: Update governance comment
        if: ${{ always() && steps.intake.outputs.outcome != 'ignored' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f "$RUNNER_TEMP/status.md" ]; then exit 0; fi
          marker="<!-- governance-bot:v1 issue=${ISSUE_NUMBER} -->"
          body_file="$RUNNER_TEMP/governance-comment.md"
          printf '%s\n\n' "$marker" > "$body_file"
          sed -n '1,240p' "$RUNNER_TEMP/status.md" >> "$body_file"
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --field "body=$(<"$body_file")"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --field "body=$(<"$body_file")"
          fi
      - name: Fail incomplete review
        if: ${{ steps.intake.outputs.outcome == 'error' || steps.validation.outcome == 'failure' || steps.scope.outcome == 'failure' || steps.pull_request.outcome == 'failure' }}
        run: exit 1
