name: Add a plugin
description: Submit one verified DeepSeek Harness plugin for registry review.
title: "[Add Plugin] "
labels:
  - plugin-submission
body:
  - type: markdown
    attributes:
      value: |
        Discovery does not publish a plugin automatically. Submit one public repository with root package.json:dsh.bundle evidence for registry review.
  - type: input
    id: name
    attributes:
      label: Plugin name
      description: Use the repository owner/name when possible.
      placeholder: owner/plugin-name
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/plugin-name
    validations:
      required: true
  - type: input
    id: install_spec
    attributes:
      label: Install identifier
      description: The unique install spec users should provide.
      placeholder: github:owner/repository
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Build & Development / Plugin Development
        - Build & Development / Code Generation
        - Build & Development / Testing & Debugging
        - Build & Development / Project Analysis
        - Agents & Workflows / Orchestration
        - Agents & Workflows / Automation
        - Agents & Workflows / Planning & Execution
        - Agents & Workflows / Memory & Context
        - Research & Knowledge / Search & Browsing
        - Research & Knowledge / Deep Research
        - Research & Knowledge / Knowledge Management
        - Research & Knowledge / Document Processing
        - Interface & Experience / Themes & Layout
        - Interface & Experience / Navigation & Panels
        - Interface & Experience / Visualization
        - Interface & Experience / Desktop & Mobile
        - Tools & Data / Files & Terminal
        - Tools & Data / Data Processing
        - Tools & Data / Media Tools
        - Tools & Data / General Utilities
        - Integrations & Communication / External Services
        - Integrations & Communication / Notifications & Monitoring
        - Integrations & Communication / Collaboration
        - Learning / Education & Explanation
    validations:
      required: true
  - type: textarea
    id: category_evidence
    attributes:
      label: Category evidence
      description: Link to README, manifest, exports, or source paths that support the primary category.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Explain what the plugin does for DeepSeek Harness users.
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: Maintainer identity
      placeholder: GitHub handle or organization
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Submission declaration
      options:
        - label: I maintain this plugin or have permission to submit it.
          required: true
        - label: The repository is public and the information above is accurate to the best of my knowledge.
          required: true
        - label: The root package.json declares dsh.bundle and the README includes installation or usage guidance.
          required: true
        - label: This request contains exactly one plugin.
          required: true
