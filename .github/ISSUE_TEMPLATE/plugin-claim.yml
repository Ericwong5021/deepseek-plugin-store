name: Claim a plugin listing
description: Ask to associate a directory record with its maintainer.
title: "[Claim] "
labels:
  - plugin-claim
body:
  - type: input
    id: repository
    attributes:
      label: Plugin repository
      description: Submit exactly one listed plugin.
      placeholder: https://github.com/owner/plugin-name
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: Maintainer GitHub account
      placeholder: github-handle
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Maintainer proof
      description: Link to a repository profile, commit, issue, or other public evidence connecting you to the plugin.
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I am authorized to represent this plugin listing.
          required: true
        - label: This request contains exactly one plugin.
          required: true
